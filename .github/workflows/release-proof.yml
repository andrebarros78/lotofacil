name: Release Proof

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "governance/**"
      - "pyproject.toml"
      - ".github/workflows/**"
      - "docs/**"
      - "README.md"

permissions:
  contents: read

jobs:
  clean-install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"
      - name: Verify GitHub-only governance
        run: python scripts/verify_github_governance.py
      - name: Build wheel
        run: python -m pip wheel . --no-deps -w dist
      - name: Create clean environment and install wheel
        run: |
          python -m venv /tmp/sare-clean
          /tmp/sare-clean/bin/python -m pip install dist/sare_lotofacil-*.whl
      - name: Prove release version and installed module origin
        run: |
          /tmp/sare-clean/bin/python - <<'PY'
          from importlib.metadata import version
          from pathlib import Path
          import sare_lotofacil
          from sare_lotofacil.api.app import create_app
          expected = "1.1.5"
          module = Path(sare_lotofacil.__file__).resolve()
          assert "site-packages" in str(module), module
          assert version("sare-lotofacil") == expected
          assert sare_lotofacil.__version__ == expected
          app = create_app('/tmp/version-proof.db')
          assert app.version == expected
          print(f"RELEASE_VERSION={expected}")
          print(f"INSTALLED_MODULE={module}")
          PY
      - name: Prove mathematical doctor
        run: /tmp/sare-clean/bin/python -m sare_lotofacil doctor
      - name: Prove persistence backup restore API import and categorical RIS
        run: |
          /tmp/sare-clean/bin/python -m sare_lotofacil init-db --path /tmp/sare.db
          /tmp/sare-clean/bin/python -m sare_lotofacil backup-db --db /tmp/sare.db --out /tmp/sare.backup.db
          /tmp/sare-clean/bin/python -m sare_lotofacil restore-db --backup /tmp/sare.backup.db --out /tmp/sare.restored.db
          /tmp/sare-clean/bin/python - <<'PY'
          from sare_lotofacil.analysis.ris import build_categorical_ris
          from sare_lotofacil.api.app import create_app
          app = create_app('/tmp/sare.restored.db', write_token='release-proof')
          paths = {route.path for route in app.routes}
          required = {'/health/live', '/health/ready', '/v1/analyses', '/v1/portfolios', '/v1/evaluations', '/v1/ris'}
          assert required <= paths
          ris = build_categorical_ris('/tmp/sare.restored.db', temporal_replications=49)
          assert ris['schema_version'] == 'ris-categorical-v1'
          assert ris['numeric_ris_enabled'] is False
          assert ris['score'] is None
          assert set(ris['dimensions']) == {'data_integrity','uniformity','cooccurrence','temporal','regime','predictive_evidence'}
          assert 'RIS_NUMERIC_FORBIDDEN_IN_1_X' in ris['guardrails']
          print('CATEGORICAL_RIS_RELEASE_PROOF_PASS')
          print('RELEASE_PROOF_BASE_PASS')
          PY
      - name: Prove calibrated regime detector from installed wheel
        run: |
          mkdir -p artifacts
          /tmp/sare-clean/bin/python - <<'PY' | tee artifacts/regime_calibration_release_proof.json
          import json
          from sare_lotofacil.analysis.regime import assess_marginal_regime
          from sare_lotofacil.simulation.alternative import simulate_marginal_regime_shift
          from sare_lotofacil.simulation.null import simulate_uniform_draws
          null_assessment = assess_marginal_regime(simulate_uniform_draws(500, seed=17).draws,min_segment=60,candidate_stride=10,calibration_replications=99,validation_replications=99,seed=20260914)
          assert null_assessment.calibration.compatible_with_target is True
          assert null_assessment.state == 'STABLE'
          assert null_assessment.calibration.validation_ci95_low <= 0.05 <= null_assessment.calibration.validation_ci95_high
          shifted = simulate_marginal_regime_shift(500,change_index=250,target_number=16,post_probability=0.85,seed=321)
          labels = tuple(f'contest-{index:04d}' for index in range(1, 501))
          alert = assess_marginal_regime(shifted.draws,candidate_labels=labels,min_segment=60,candidate_stride=10,calibration_replications=99,validation_replications=99,seed=20260914)
          assert alert.state == 'ALERT'
          assert alert.scan.strongest.candidate_index == 250
          assert alert.scan.strongest.strongest_number == 16
          assert alert.mode == 'RETROSPECTIVE_DISCOVERY'
          print(json.dumps({'status':'REGIME_CALIBRATION_RELEASE_PROOF_PASS','null_state':null_assessment.state,'calibration_compatible':null_assessment.calibration.compatible_with_target,'controlled_shift_state':alert.state,'controlled_shift_candidate_index':alert.scan.strongest.candidate_index,'controlled_shift_number':alert.scan.strongest.strongest_number,'mode':alert.mode}, sort_keys=True))
          PY
      - name: Prove T17 and T18 controlled alternatives from installed wheel
        run: |
          /tmp/sare-clean/bin/python - <<'PY' | tee artifacts/controlled_alternatives_release_proof.json
          import json
          from dataclasses import asdict
          from sare_lotofacil.simulation.validation import assess_temporal_memory_separation, measure_marginal_bias_power
          t17 = measure_marginal_bias_power(replications=30,draw_count=400,target_number=16,target_probability=0.72,alpha=0.05,base_seed=20260914)
          assert t17.power >= 0.80 and t17.detections >= 24 and t17.mean_target_effect >= 0.08
          t18 = assess_temporal_memory_separation(draw_count=600,memory_probability=0.30,retained_count=12,alpha=0.05,seed=20260914,permutation_replications=399)
          assert t18.marginal_alerts == 0 and t18.temporal_alerts >= 1 and t18.lag1_effect > 0.50 and t18.lag1_p_holm < 0.05
          print(json.dumps({'status':'CONTROLLED_ALTERNATIVES_RELEASE_PROOF_PASS','t17':asdict(t17),'t18':asdict(t18)}, sort_keys=True))
          PY
      - name: Prove T20 T23 backtest integrity from installed wheel
        run: |
          /tmp/sare-clean/bin/python - <<'PY' | tee artifacts/backtest_integrity_release_proof.json
          import json
          from sare_lotofacil.experiments.backtest import BacktestLeakageError, BacktestWindow, FittedTransform, TemporalVariable, run_audited_backtest
          blocked_variable = False
          try:
              run_audited_backtest((BacktestWindow('t20',199,200,(TemporalVariable('future_result_200',200),),()),), lambda _: 0.20, min_successful_windows=1)
          except BacktestLeakageError as exc:
              blocked_variable = 'LOOKAHEAD_LEAKAGE_DETECTED' in str(exc)
          assert blocked_variable
          blocked_transform = False
          try:
              run_audited_backtest((BacktestWindow('t21',249,250,(TemporalVariable('history_prefix',249),),(FittedTransform('global_standardizer',400),)),), lambda _: 0.20, min_successful_windows=1)
          except BacktestLeakageError as exc:
              blocked_transform = 'TRANSFORM_FIT_LEAKAGE_DETECTED' in str(exc)
          assert blocked_transform
          windows = tuple(BacktestWindow(f'w{i}',100+i,101+i,(TemporalVariable('history_prefix',100+i),),(FittedTransform('fit',100+i),)) for i in range(5))
          def scorer(window):
              if window.window_id == 'w2': raise ArithmeticError('synthetic-window-failure')
              return 0.20
          t22 = run_audited_backtest(windows, scorer, min_successful_windows=4, min_success_rate=0.80)
          assert t22.planned_windows == 5 and t22.successful_windows == 4 and t22.failed_windows == 1 and t22.success_rate == 0.80
          assert all(outcome.m0_brier == 0.24 for outcome in t22.outcomes)
          short = tuple(BacktestWindow(f's{i}',200+i,201+i,(TemporalVariable('history_prefix',200+i),),(FittedTransform('fit',200+i),)) for i in range(3))
          t23 = run_audited_backtest(short, lambda _: 0.10, min_successful_windows=10, min_success_rate=0.80)
          assert t23.status == 'INCONCLUSIVE' and t23.predictive_evidence == 'NOT_ESTABLISHED'
          print(json.dumps({'status':'BACKTEST_INTEGRITY_RELEASE_PROOF_PASS','t20_blocked':blocked_variable,'t21_blocked':blocked_transform,'t22':{'planned':t22.planned_windows,'success':t22.successful_windows,'failed':t22.failed_windows,'success_rate':t22.success_rate,'ledger_hash':t22.content_hash},'t23':{'status':t23.status,'predictive_evidence':t23.predictive_evidence,'planned':t23.planned_windows,'success':t23.successful_windows}}, sort_keys=True))
          PY
      - name: Prove Operational 1.1 journey from installed wheel
        run: |
          /tmp/sare-clean/bin/python scripts/prove_operational_release.py | tee artifacts/operational_release_proof.json
          grep -q '"status": "OPERATIONAL_RELEASE_PROOF_PASS"' artifacts/operational_release_proof.json
      - name: Upload wheel
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: sare-lotofacil-wheel
          path: dist/*.whl
          if-no-files-found: error
      - name: Upload operational proof
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: operational-release-proof
          path: artifacts/operational_release_proof.json
          if-no-files-found: error
      - name: Upload regime calibration proof
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: regime-calibration-release-proof
          path: artifacts/regime_calibration_release_proof.json
          if-no-files-found: error
      - name: Upload controlled alternatives proof
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: controlled-alternatives-release-proof
          path: artifacts/controlled_alternatives_release_proof.json
          if-no-files-found: error
      - name: Upload backtest integrity proof
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: backtest-integrity-release-proof
          path: artifacts/backtest_integrity_release_proof.json
          if-no-files-found: error
