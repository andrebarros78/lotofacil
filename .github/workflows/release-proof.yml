name: Release Proof

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "governance/**"
      - "requirements.lock.txt"
      - "pyproject.toml"
      - ".github/workflows/**"
      - "docs/**"
      - "README.md"

permissions:
  contents: read

jobs:
  clean-install:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"
      - name: Verify GitHub-only governance
        run: python scripts/verify_github_governance.py
      - name: Build wheel
        run: python -m pip wheel . --no-deps -w dist
      - name: Create clean environment and install locked wheel
        run: |
          python -m venv /tmp/sare-clean
          /tmp/sare-clean/bin/python -m pip install -c requirements.lock.txt dist/sare_lotofacil-*.whl
      - name: Prove release version and installed module origin
        run: |
          /tmp/sare-clean/bin/python - <<'PY'
          from importlib.metadata import version
          from pathlib import Path
          import sare_lotofacil
          from sare_lotofacil.api.app import create_app
          expected = "1.1.9"
          module = Path(sare_lotofacil.__file__).resolve()
          assert "site-packages" in str(module), module
          assert version("sare-lotofacil") == expected
          assert sare_lotofacil.__version__ == expected
          app = create_app('/tmp/version-proof.db')
          assert app.version == expected
          paths = {route.path for route in app.routes}
          required = {'/health/live','/health/ready','/v1/analyses','/v1/portfolios','/v1/evaluations','/v1/evaluations/revisions','/v1/ris'}
          assert required <= paths
          print(f"RELEASE_VERSION={expected}")
          print(f"INSTALLED_MODULE={module}")
          PY
      - name: Prove mathematical doctor
        run: /tmp/sare-clean/bin/python -m sare_lotofacil doctor
      - name: Prove persistence backup restore and categorical RIS
        run: |
          /tmp/sare-clean/bin/python -m sare_lotofacil init-db --path /tmp/sare.db
          /tmp/sare-clean/bin/python -m sare_lotofacil backup-db --db /tmp/sare.db --out /tmp/sare.backup.db
          /tmp/sare-clean/bin/python -m sare_lotofacil restore-db --backup /tmp/sare.backup.db --out /tmp/sare.restored.db
          /tmp/sare-clean/bin/python - <<'PY'
          from sare_lotofacil.analysis.ris import build_categorical_ris
          ris = build_categorical_ris('/tmp/sare.restored.db', temporal_replications=49)
          assert ris['schema_version'] == 'ris-categorical-v1'
          assert ris['numeric_ris_enabled'] is False
          assert ris['score'] is None
          assert 'RIS_NUMERIC_FORBIDDEN_IN_1_X' in ris['guardrails']
          print('CATEGORICAL_RIS_RELEASE_PROOF_PASS')
          print('RELEASE_PROOF_BASE_PASS')
          PY
      - name: Prove release integrity suite and PRIMARY_CARD from installed wheel
        run: |
          mkdir -p artifacts
          /tmp/sare-clean/bin/python scripts/prove_release_integrity_v118.py | tee artifacts/release_integrity_suite.log
          grep -q 'REGIME_CALIBRATION_RELEASE_PROOF_PASS' artifacts/release_integrity_suite.log
          grep -q 'CONTROLLED_ALTERNATIVES_RELEASE_PROOF_PASS' artifacts/release_integrity_suite.log
          grep -q 'BACKTEST_INTEGRITY_RELEASE_PROOF_PASS' artifacts/release_integrity_suite.log
          grep -q 'RISK_REPRO_JOINT_COVERAGE_RELEASE_PROOF_PASS' artifacts/release_integrity_suite.log
          grep -q 'PORTFOLIO_ECONOMIC_INTEGRITY_RELEASE_PROOF_PASS' artifacts/release_integrity_suite.log
          grep -q 'PRIMARY_CARD_RELEASE_PROOF_PASS' artifacts/release_integrity_suite.log
          grep -q 'RELEASE_INTEGRITY_SUITE_PASS' artifacts/release_integrity_suite.log
          grep -q '"selection_method": "M1_TOP15_M2_TIEBREAK_V1"' artifacts/primary_card_release_proof.json
          grep -q '"card_count": 1' artifacts/primary_card_release_proof.json
          grep -q '"number_count": 15' artifacts/primary_card_release_proof.json
          grep -q '"deterministic": true' artifacts/primary_card_release_proof.json
      - name: Prove Operational 1.1 journey from installed wheel
        run: |
          /tmp/sare-clean/bin/python scripts/prove_operational_release.py | tee artifacts/operational_release_proof.json
          grep -q '"status": "OPERATIONAL_RELEASE_PROOF_PASS"' artifacts/operational_release_proof.json
      - name: Upload wheel
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: sare-lotofacil-wheel
          path: dist/*.whl
          if-no-files-found: error
      - name: Upload operational proof
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: operational-release-proof
          path: artifacts/operational_release_proof.json
          if-no-files-found: error
      - name: Upload regime calibration proof
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: regime-calibration-release-proof
          path: artifacts/regime_calibration_release_proof.json
          if-no-files-found: error
      - name: Upload controlled alternatives proof
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: controlled-alternatives-release-proof
          path: artifacts/controlled_alternatives_release_proof.json
          if-no-files-found: error
      - name: Upload backtest integrity proof
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: backtest-integrity-release-proof
          path: artifacts/backtest_integrity_release_proof.json
          if-no-files-found: error
      - name: Upload T24 T29 proof
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: risk-repro-joint-coverage-release-proof
          path: artifacts/risk_repro_joint_coverage_release_proof.json
          if-no-files-found: error
      - name: Upload T30 T39 proof
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: portfolio-economic-integrity-release-proof
          path: artifacts/portfolio_economic_integrity_release_proof.json
          if-no-files-found: error
      - name: Upload PRIMARY_CARD proof
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: primary-card-release-proof
          path: artifacts/primary_card_release_proof.json
          if-no-files-found: error
