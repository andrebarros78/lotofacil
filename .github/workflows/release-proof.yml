name: Release Proof

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "governance/**"
      - "pyproject.toml"
      - ".github/workflows/**"
      - "docs/**"
      - "README.md"

permissions:
  contents: read

jobs:
  clean-install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"
      - name: Verify GitHub-only governance
        run: python scripts/verify_github_governance.py
      - name: Build wheel
        run: python -m pip wheel . --no-deps -w dist
      - name: Create clean environment and install wheel
        run: |
          python -m venv /tmp/sare-clean
          /tmp/sare-clean/bin/python -m pip install dist/sare_lotofacil-*.whl
      - name: Prove release version and installed module origin
        run: |
          /tmp/sare-clean/bin/python - <<'PY'
          from importlib.metadata import version
          from pathlib import Path
          import sare_lotofacil
          from sare_lotofacil.api.app import create_app
          expected = "1.1.5"
          module = Path(sare_lotofacil.__file__).resolve()
          assert "site-packages" in str(module), module
          assert version("sare-lotofacil") == expected
          assert sare_lotofacil.__version__ == expected
          app = create_app('/tmp/version-proof.db')
          assert app.version == expected
          print(f"RELEASE_VERSION={expected}")
          print(f"INSTALLED_MODULE={module}")
          PY
      - name: Prove mathematical doctor
        run: /tmp/sare-clean/bin/python -m sare_lotofacil doctor
      - name: Prove persistence backup restore API import and categorical RIS
        run: |
          /tmp/sare-clean/bin/python -m sare_lotofacil init-db --path /tmp/sare.db
          /tmp/sare-clean/bin/python -m sare_lotofacil backup-db --db /tmp/sare.db --out /tmp/sare.backup.db
          /tmp/sare-clean/bin/python -m sare_lotofacil restore-db --backup /tmp/sare.backup.db --out /tmp/sare.restored.db
          /tmp/sare-clean/bin/python - <<'PY'
          from sare_lotofacil.analysis.ris import build_categorical_ris
          from sare_lotofacil.api.app import create_app
          app = create_app('/tmp/sare.restored.db', write_token='release-proof')
          paths = {route.path for route in app.routes}
          required = {'/health/live', '/health/ready', '/v1/analyses', '/v1/portfolios', '/v1/evaluations', '/v1/ris'}
          assert required <= paths
          ris = build_categorical_ris('/tmp/sare.restored.db', temporal_replications=49)
          assert ris['schema_version'] == 'ris-categorical-v1'
          assert ris['numeric_ris_enabled'] is False
          assert ris['score'] is None
          assert set(ris['dimensions']) == {
              'data_integrity', 'uniformity', 'cooccurrence', 'temporal', 'regime', 'predictive_evidence'
          }
          assert 'RIS_NUMERIC_FORBIDDEN_IN_1_X' in ris['guardrails']
          print('CATEGORICAL_RIS_RELEASE_PROOF_PASS')
          print('RELEASE_PROOF_BASE_PASS')
          PY
      - name: Prove calibrated regime detector from installed wheel
        run: |
          mkdir -p artifacts
          /tmp/sare-clean/bin/python - <<'PY' | tee artifacts/regime_calibration_release_proof.json
          import json
          from sare_lotofacil.analysis.regime import assess_marginal_regime
          from sare_lotofacil.simulation.alternative import simulate_marginal_regime_shift
          from sare_lotofacil.simulation.null import simulate_uniform_draws

          null_draws = simulate_uniform_draws(500, seed=17).draws
          null_assessment = assess_marginal_regime(
              null_draws,
              min_segment=60,
              candidate_stride=10,
              calibration_replications=99,
              validation_replications=99,
              seed=20260914,
          )
          assert null_assessment.calibration.compatible_with_target is True
          assert null_assessment.state == 'STABLE'
          assert null_assessment.calibration.validation_ci95_low <= 0.05 <= null_assessment.calibration.validation_ci95_high

          shifted = simulate_marginal_regime_shift(
              500,
              change_index=250,
              target_number=16,
              post_probability=0.85,
              seed=321,
          )
          labels = tuple(f'contest-{index:04d}' for index in range(1, 501))
          alert_assessment = assess_marginal_regime(
              shifted.draws,
              candidate_labels=labels,
              min_segment=60,
              candidate_stride=10,
              calibration_replications=99,
              validation_replications=99,
              seed=20260914,
          )
          assert alert_assessment.state == 'ALERT'
          assert alert_assessment.scan.strongest.candidate_index == 250
          assert alert_assessment.scan.strongest.strongest_number == 16
          assert alert_assessment.mode == 'RETROSPECTIVE_DISCOVERY'

          payload = {
              'status': 'REGIME_CALIBRATION_RELEASE_PROOF_PASS',
              'null_state': null_assessment.state,
              'false_alarm_target': null_assessment.calibration.target_alpha,
              'false_alarm_rate': null_assessment.calibration.validation_false_alarm_rate,
              'false_alarm_ci95_low': null_assessment.calibration.validation_ci95_low,
              'false_alarm_ci95_high': null_assessment.calibration.validation_ci95_high,
              'calibration_compatible': null_assessment.calibration.compatible_with_target,
              'controlled_shift_state': alert_assessment.state,
              'controlled_shift_candidate_index': alert_assessment.scan.strongest.candidate_index,
              'controlled_shift_number': alert_assessment.scan.strongest.strongest_number,
              'mode': alert_assessment.mode,
          }
          print(json.dumps(payload, sort_keys=True))
          PY
          grep -q 'REGIME_CALIBRATION_RELEASE_PROOF_PASS' artifacts/regime_calibration_release_proof.json
      - name: Prove T17 and T18 controlled alternatives from installed wheel
        run: |
          mkdir -p artifacts
          /tmp/sare-clean/bin/python - <<'PY' | tee artifacts/controlled_alternatives_release_proof.json
          import json
          from dataclasses import asdict
          from sare_lotofacil.simulation.validation import (
              assess_temporal_memory_separation,
              measure_marginal_bias_power,
          )

          t17 = measure_marginal_bias_power(
              replications=30,
              draw_count=400,
              target_number=16,
              target_probability=0.72,
              alpha=0.05,
              base_seed=20260914,
          )
          assert t17.power >= 0.80
          assert t17.detections >= 24
          assert t17.mean_target_effect >= 0.08

          t18 = assess_temporal_memory_separation(
              draw_count=600,
              memory_probability=0.30,
              retained_count=12,
              alpha=0.05,
              seed=20260914,
              permutation_replications=399,
          )
          assert t18.marginal_alerts == 0
          assert t18.temporal_alerts >= 1
          assert t18.lag1_effect > 0.50
          assert t18.lag1_p_holm < 0.05

          payload = {
              'status': 'CONTROLLED_ALTERNATIVES_RELEASE_PROOF_PASS',
              't17': asdict(t17),
              't18': asdict(t18),
              'interpretation': 'Synthetic sensitivity/separation proof only; no predictive advantage is inferred for real Lotofacil history.',
          }
          print(json.dumps(payload, sort_keys=True))
          PY
          grep -q 'CONTROLLED_ALTERNATIVES_RELEASE_PROOF_PASS' artifacts/controlled_alternatives_release_proof.json
      - name: Prove T20-T23 leakage and backtest integrity from installed wheel
        run: |
          mkdir -p artifacts
          /tmp/sare-clean/bin/python - <<'PY' | tee artifacts/leakage_backtest_release_proof.json
          import json
          from dataclasses import asdict
          from sare_lotofacil.experiments.integrity import TemporalIntegrityViolation, audit_backtest_windows
          from sare_lotofacil.experiments.protocol import ExperimentProtocol

          def protocol(**overrides):
              payload = {
                  'hypothesis_id': 'release-integrity',
                  'question': 'O protocolo temporal é íntegro?',
                  'h0': 'Sem vantagem',
                  'h1': 'Há vantagem',
                  'snapshot_id': 'snap-release-proof',
              }
              payload.update(overrides)
              return ExperimentProtocol(**payload)

          def blocked_code(candidate):
              try:
                  _ = candidate.protocol_hash
              except TemporalIntegrityViolation as exc:
                  return exc.code
              raise AssertionError('protocol should have been blocked')

          t20_code = blocked_code(protocol(feature_offsets=(-1, 0)))
          assert t20_code == 'FUTURE_OR_TARGET_FEATURE_OFFSET'
          t21_code = blocked_code(protocol(transform_fit_scope='FULL_HISTORY'))
          assert t21_code == 'TRANSFORM_FIT_OUTSIDE_TRAIN'

          windows = tuple(f'window-{index:02d}' for index in range(35))
          def evaluator(window_id):
              if window_id == 'window-11':
                  raise RuntimeError('synthetic window failure')
              return 0.24
          values, t22 = audit_backtest_windows(windows, evaluator, min_required_windows=30)
          assert len(values) == 34
          assert t22.total_windows == 35
          assert t22.successful_windows == 34
          assert t22.failed_windows == 1
          assert t22.status == 'INCONCLUSIVE_WINDOW_FAILURES'
          assert t22.advantage_eligible is False

          few_values, t23 = audit_backtest_windows(
              tuple(f'window-{index:02d}' for index in range(5)),
              lambda _: 0.20,
              min_required_windows=30,
          )
          assert len(few_values) == 5
          assert t23.total_windows == 5
          assert t23.status == 'INCONCLUSIVE_INSUFFICIENT_WINDOWS'
          assert t23.advantage_eligible is False

          payload = {
              'status': 'LEAKAGE_BACKTEST_INTEGRITY_RELEASE_PROOF_PASS',
              't20_block_code': t20_code,
              't21_block_code': t21_code,
              't22': asdict(t22),
              't23': asdict(t23),
              'interpretation': 'Integrity/readiness proof only; no predictive advantage is created by passing T20-T23.',
          }
          print(json.dumps(payload, sort_keys=True))
          PY
          grep -q 'LEAKAGE_BACKTEST_INTEGRITY_RELEASE_PROOF_PASS' artifacts/leakage_backtest_release_proof.json
      - name: Prove Operational 1.1 journey from installed wheel
        run: |
          mkdir -p artifacts
          /tmp/sare-clean/bin/python scripts/prove_operational_release.py | tee artifacts/operational_release_proof.json
          grep -q '"status": "OPERATIONAL_RELEASE_PROOF_PASS"' artifacts/operational_release_proof.json
      - name: Upload wheel
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: sare-lotofacil-wheel
          path: dist/*.whl
          if-no-files-found: error
      - name: Upload operational proof
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: operational-release-proof
          path: artifacts/operational_release_proof.json
          if-no-files-found: error
      - name: Upload regime calibration proof
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: regime-calibration-release-proof
          path: artifacts/regime_calibration_release_proof.json
          if-no-files-found: error
      - name: Upload controlled alternatives proof
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: controlled-alternatives-release-proof
          path: artifacts/controlled_alternatives_release_proof.json
          if-no-files-found: error
      - name: Upload leakage and backtest integrity proof
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: leakage-backtest-integrity-release-proof
          path: artifacts/leakage_backtest_release_proof.json
          if-no-files-found: error
