name: F11 Prospective Evidence Campaign Proof

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/f11-prospective-evidence-campaign-proof.yml"
      - "scripts/prove_f11_prospective_campaign.py"
      - "docs/GITHUB_OPERATIONS.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/f11-prospective-evidence-campaign-proof.yml"
      - "scripts/prove_f11_prospective_campaign.py"
      - "docs/GITHUB_OPERATIONS.md"

permissions:
  contents: read

jobs:
  prospective-campaign:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          path: app
          fetch-depth: 0

      - name: Checkout canonical operational state
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: operations/state
          path: state-store
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"

      - name: Verify committed operational state
        shell: bash
        run: |
          set -euo pipefail
          python app/scripts/verify_github_operational_state.py --state-dir state-store/operations

      - name: Prove prospective evidence campaign
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python app/scripts/prove_f11_prospective_campaign.py             --state-dir state-store/operations             --out artifacts/f11_prospective_evidence_campaign_proof.json
          grep -q '"status": "F11_PROSPECTIVE_EVIDENCE_CAMPAIGN_PROOF_PASS"' artifacts/f11_prospective_evidence_campaign_proof.json
          grep -q '"prospective_state": "UNDER_TEST_COHORT_A"' artifacts/f11_prospective_evidence_campaign_proof.json
          grep -q '"predictive_evidence": "NOT_ESTABLISHED"' artifacts/f11_prospective_evidence_campaign_proof.json

      - name: Upload F11 evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: f11-prospective-evidence-campaign-proof
          path: artifacts/f11_prospective_evidence_campaign_proof.json
          if-no-files-found: error
          retention-days: 90
