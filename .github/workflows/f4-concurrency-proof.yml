name: F4 Concurrency Proof

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/f4-concurrency-proof.yml"
      - "src/sare_lotofacil/persistence/jobs.py"
      - "src/sare_lotofacil/persistence/operations.py"
      - "src/sare_lotofacil/persistence/db.py"
      - "src/sare_lotofacil/api/app.py"
      - "tests/test_jobs.py"
      - "tests/test_idempotency_reservations.py"
      - "tests/test_api.py"

permissions:
  contents: read

jobs:
  concurrency-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"
      - name: Install locked environment
        run: python -m pip install -e .[dev]
      - name: Prove atomic idempotency and lease fencing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          pytest -q             tests/test_idempotency_reservations.py             tests/test_jobs.py             tests/test_api.py | tee artifacts/f4-pytest.txt
      - name: Emit terminal F4 proof
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          proof = {
              "status": "F4_CONCURRENCY_PROOF_PASS",
              "idempotency_protocol": "RESERVE_BEFORE_EFFECT_V1",
              "duplicate_in_progress": "BLOCKED",
              "lease_protocol": "HEARTBEAT_FENCING_V1",
              "expired_worker_checkpoint": "BLOCKED",
              "expired_worker_completion": "BLOCKED",
              "expired_lease_renewal": "BLOCKED",
              "fencing_token_reclaim": "PROVEN",
              "schema_version": 10,
          }
          Path("artifacts/f4-terminal.json").write_text(
              json.dumps(proof, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(proof, sort_keys=True))
          PY
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: f4-concurrency-proof
          path: artifacts/
          if-no-files-found: error
          retention-days: 90
