name: SARE Operator Console Proof

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/operator-console-proof.yml"
      - ".github/workflows/operator-console.yml"
      - "scripts/github_operator_console.py"
      - "scripts/verify_github_operational_state.py"
      - "scripts/verify_github_governance.py"
      - "governance/**"
      - "docs/MISSION_PROVEN.md"
      - "src/**"
      - "tests/test_github_operator_console.py"
      - "tests/test_primary_card.py"
      - "tests/test_ris.py"
      - "tests/test_regime.py"
      - "pyproject.toml"

permissions:
  contents: read

jobs:
  prove-console:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout canonical engine
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: main
          path: app
      - name: Checkout canonical operational state
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: operations/state
          fetch-depth: 0
          path: state-store
      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"
      - name: Install canonical engine
        run: python -m pip install ./app
      - name: Verify GitHub-only governance
        run: python app/scripts/verify_github_governance.py
      - name: Audit canonical state
        run: |
          mkdir -p artifacts/operator-proof
          python app/scripts/verify_github_operational_state.py \
            --state-dir state-store/operations \
            --out artifacts/operator-proof/state_audit.json
          grep -q '"status": "GITHUB_OPERATIONAL_AUDIT_PASS"' artifacts/operator-proof/state_audit.json
      - name: Prove all read-only operator actions including PRIMARY_CARD
        run: |
          python app/scripts/github_operator_console.py --action status --state-dir state-store/operations --out-dir artifacts/operator-proof/status
          python app/scripts/github_operator_console.py --action audit --state-dir state-store/operations --out-dir artifacts/operator-proof/audit
          python app/scripts/github_operator_console.py --action analyze --state-dir state-store/operations --out-dir artifacts/operator-proof/analyze
          python app/scripts/github_operator_console.py --action ris --state-dir state-store/operations --out-dir artifacts/operator-proof/ris
          python app/scripts/github_operator_console.py --action primary-card --state-dir state-store/operations --out-dir artifacts/operator-proof/primary-card
          python app/scripts/github_operator_console.py --action portfolio --state-dir state-store/operations --out-dir artifacts/operator-proof/portfolio --card-count 1 --seed 0
          python app/scripts/github_operator_console.py --action export --state-dir state-store/operations --out-dir artifacts/operator-proof/export
          grep -q '"status": "GITHUB_OPERATOR_STATE_PASS"' artifacts/operator-proof/status/status.json
          grep -q '"status": "GITHUB_OPERATOR_STATE_PASS"' artifacts/operator-proof/audit/audit.json
          grep -q '"status": "GITHUB_OPERATOR_ANALYSIS_PASS"' artifacts/operator-proof/analyze/analysis.json
          grep -q '"latest_post_contest_report": {' artifacts/operator-proof/analyze/analysis.json
          grep -q '"contest_number":' artifacts/operator-proof/analyze/analysis.json
          grep -q '"hits":' artifacts/operator-proof/analyze/analysis.json
          grep -q 'Autoanálise do processo' artifacts/operator-proof/export/operational_report.md
          grep -q '"status": "GITHUB_OPERATOR_RIS_PASS"' artifacts/operator-proof/ris/ris.json
          grep -q '"numeric_ris_enabled": false' artifacts/operator-proof/ris/ris.json
          grep -q '"score": null' artifacts/operator-proof/ris/ris.json
          grep -q 'RIS_NUMERIC_FORBIDDEN_IN_1_X' artifacts/operator-proof/ris/ris.json
          grep -q '"method": "calibrated_global_marginal_change_scan"' artifacts/operator-proof/ris/ris.json
          grep -q '"mode": "RETROSPECTIVE_DISCOVERY"' artifacts/operator-proof/ris/ris.json
          grep -q '"candidate_label":' artifacts/operator-proof/ris/ris.json
          grep -q 'REGIME_ALERT_IS_RETROSPECTIVE_NOT_REALTIME' artifacts/operator-proof/ris/ris.json
          grep -q '"status": "GITHUB_OPERATOR_PRIMARY_CARD_PASS"' artifacts/operator-proof/primary-card/primary_card.json
          grep -q '"card_count": 1' artifacts/operator-proof/primary-card/primary_card.json
          grep -q '"selection_method": "M1_TOP15_M2_TIEBREAK_V1"' artifacts/operator-proof/primary-card/primary_card.json
          grep -q '"status": "GITHUB_OPERATOR_PORTFOLIO_PREVIEW_PASS"' artifacts/operator-proof/portfolio/portfolio_preview.json
          grep -q '"artifact_status": "PREVIEW"' artifacts/operator-proof/portfolio/portfolio_preview.json
          grep -q '"operational_use_allowed": false' artifacts/operator-proof/portfolio/portfolio_preview.json
          grep -q '"card_count": 1' artifacts/operator-proof/portfolio/portfolio_preview.json
          grep -q 'CARTEIRA COMBINATÓRIA — SEM VANTAGEM PREDITIVA COMPROVADA' artifacts/operator-proof/portfolio/portfolio_preview.json
          grep -q '"status": "GITHUB_OPERATOR_EXPORT_PASS"' artifacts/operator-proof/export/operational_report.json
          test -s artifacts/operator-proof/export/operational_report.md
          python - <<'PY'
          import json
          from pathlib import Path
          status = json.loads(Path('artifacts/operator-proof/status/status.json').read_text(encoding='utf-8'))
          ris = json.loads(Path('artifacts/operator-proof/ris/ris.json').read_text(encoding='utf-8'))
          primary = json.loads(Path('artifacts/operator-proof/primary-card/primary_card.json').read_text(encoding='utf-8'))
          portfolio = json.loads(Path('artifacts/operator-proof/portfolio/portfolio_preview.json').read_text(encoding='utf-8'))
          assert primary['target_contest'] == status['next_prediction_target']
          assert primary['training_last_contest'] == primary['target_contest'] - 1
          assert len(primary['card']) == len(set(primary['card'])) == 15
          assert len(primary['decision_sha256']) == 64
          assert portfolio['artifact_status'] == 'PREVIEW'
          assert portfolio['operational_use_allowed'] is False
          regime = ris['dimensions']['regime']
          calibration = regime['evidence']['false_alarm_calibration']
          compatible = calibration['compatible_with_target']
          assert type(compatible) is bool
          if not compatible:
              assert regime['state'] == 'INCONCLUSIVE'
              assert regime['evidence'].get('reason')
          PY
      - name: Resolve state SHA
        id: state
        run: echo "sha=$(git -C state-store rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Record provenance
        env:
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          STATE_SHA: ${{ steps.state.outputs.sha }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          primary = json.loads(Path('artifacts/operator-proof/primary-card/primary_card.json').read_text(encoding='utf-8'))
          portfolio = json.loads(Path('artifacts/operator-proof/portfolio/portfolio_preview.json').read_text(encoding='utf-8'))
          ris = json.loads(Path('artifacts/operator-proof/ris/ris.json').read_text(encoding='utf-8'))
          regime = ris['dimensions']['regime']
          payload = {
              "status": "SARE_OPERATOR_CONSOLE_PROOF_PASS",
              "source_sha": os.environ["SOURCE_SHA"],
              "operations_state_sha": os.environ["STATE_SHA"],
              "workflow_run_id": os.environ["RUN_ID"],
              "actions": ["status", "audit", "analyze", "ris", "primary-card", "portfolio", "export"],
              "primary_card": {
                  "target_contest": primary["target_contest"],
                  "training_last_contest": primary["training_last_contest"],
                  "card": primary["card"],
                  "decision_sha256": primary["decision_sha256"],
                  "decision_source": primary["decision_source"],
                  "selection_method": primary["selection_method"],
              },
              "portfolio_preview": {
                  "status": portfolio["status"],
                  "artifact_status": portfolio["artifact_status"],
                  "operational_use_allowed": portfolio["operational_use_allowed"],
              },
              "regime_calibration": {
                  "state": regime["state"],
                  "compatible_with_target": regime["evidence"]["false_alarm_calibration"]["compatible_with_target"],
              },
              "regime_calibration_required": True,
              "write_capability": False,
          }
          Path("artifacts/operator-proof/provenance.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY
      - name: Upload operator console proof
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: sare-operator-console-proof-${{ github.run_id }}
          path: artifacts/operator-proof/**
          if-no-files-found: error
