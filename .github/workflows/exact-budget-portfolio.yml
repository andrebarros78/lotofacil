name: Exact Budget Portfolio

on:
  workflow_run:
    workflows: ["Adaptive Primary Challenger"]
    types: [completed]
  workflow_dispatch:

permissions: {}

concurrency:
  group: sare-exact-budget-portfolio
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout engine
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: main
          path: app
      - name: Checkout committed operational state
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: operations/state
          path: state-store
      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"
      - name: Install engine and test exact optimizer
        run: |
          python -m pip install './app[dev]'
          cd app
          python -m pytest tests/test_exact_budget_optimizer.py tests/test_coverage_guard.py
      - name: Build exact budget portfolio frontier
        run: |
          python app/scripts/build_exact_budget_portfolio.py \
            --state-dir state-store/operations \
            --out state-store/operations/exact_budget_portfolio.json \
            | tee exact-budget-portfolio-proof.json
          grep -q '"status": "EXACT_BUDGET_PORTFOLIO_PROVEN"' exact-budget-portfolio-proof.json
          grep -q '"purchase_executed": false' exact-budget-portfolio-proof.json
          grep -q '"global_full_space_optimality_proven": false' exact-budget-portfolio-proof.json
      - name: Persist exact budget portfolio proof into operational state
        working-directory: state-store
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add operations/exact_budget_portfolio.json
          if git diff --cached --quiet; then
            echo "EXACT_BUDGET_PORTFOLIO_UNCHANGED"
          else
            git commit -m "ops: persist exact budget portfolio frontier"
            git push origin HEAD:operations/state
          fi
      - name: Upload exact budget portfolio proof
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: exact-budget-portfolio
          path: |
            exact-budget-portfolio-proof.json
            state-store/operations/exact_budget_portfolio.json
          if-no-files-found: error
