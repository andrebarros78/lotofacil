name: F6 Evaluation Isolation Proof

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/f6-evaluation-isolation-proof.yml"
      - "scripts/prove_evaluation_isolation.py"
      - "scripts/verify_github_operational_state.py"
      - "src/sare_lotofacil/evaluation.py"
      - "src/sare_lotofacil/persistence/db.py"
      - "src/sare_lotofacil/persistence/operations.py"
      - "src/sare_lotofacil/api/legacy_app.py"
      - "tests/test_evaluation_isolation.py"
      - "tests/test_api.py"
      - "tests/test_integrity_t30_t39.py"
      - "tests/test_operational_state_contamination.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/f6-evaluation-isolation-proof.yml"
      - "scripts/prove_evaluation_isolation.py"
      - "scripts/verify_github_operational_state.py"
      - "src/sare_lotofacil/evaluation.py"
      - "src/sare_lotofacil/persistence/db.py"
      - "src/sare_lotofacil/persistence/operations.py"
      - "src/sare_lotofacil/api/legacy_app.py"
      - "tests/test_evaluation_isolation.py"
      - "tests/test_api.py"
      - "tests/test_integrity_t30_t39.py"
      - "tests/test_operational_state_contamination.py"

permissions:
  contents: read

jobs:
  evaluation-isolation-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout candidate engine
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          path: app

      - name: Checkout canonical operational state
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: operations/state
          fetch-depth: 0
          path: state-store

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"

      - name: Install locked candidate test environment
        run: |
          cd app
          python -m pip install -c requirements.lock.txt -e '.[dev]'

      - name: Focused evaluation isolation regression
        shell: bash
        run: |
          set -euo pipefail
          cd app
          python -m pytest -q             tests/test_evaluation_isolation.py             tests/test_api.py             tests/test_integrity_t30_t39.py             tests/test_operational_state_contamination.py | tee ../artifacts-f6-tests.txt

      - name: Run deterministic F6 proof
        run: |
          mkdir -p artifacts
          python app/scripts/prove_evaluation_isolation.py             --work-dir artifacts/runtime             --out artifacts/f6_evaluation_isolation.json
          grep -q '"status": "EVALUATION_ISOLATION_PROOF_PASS"' artifacts/f6_evaluation_isolation.json
          grep -q '"evaluation_class": "MANUAL_EVALUATION"' artifacts/f6_evaluation_isolation.json
          grep -q '"evaluation_class": "CANONICAL_EVALUATION"' artifacts/f6_evaluation_isolation.json
          grep -q '"canonical_target_mismatch_blocked": true' artifacts/f6_evaluation_isolation.json

      - name: Verify canonical operational evaluation binding
        run: |
          python app/scripts/verify_github_operational_state.py             --state-dir state-store/operations             --out artifacts/operational_state_integrity.json
          grep -q '"status": "GITHUB_OPERATIONAL_AUDIT_PASS"' artifacts/operational_state_integrity.json
          grep -q '"evaluation_class": "CANONICAL_EVALUATION"' artifacts/operational_state_integrity.json
          grep -q '"canonical_binding_verified": true' artifacts/operational_state_integrity.json

      - name: Record provenance
        run: |
          git -C app rev-parse HEAD | tee artifacts/candidate_code_commit.txt
          git -C state-store rev-parse HEAD | tee artifacts/operations_state_commit.txt
          cp artifacts-f6-tests.txt artifacts/f6-focused-tests.txt

      - name: Upload F6 evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: f6-evaluation-isolation-proof
          path: |
            artifacts/f6_evaluation_isolation.json
            artifacts/operational_state_integrity.json
            artifacts/f6-focused-tests.txt
            artifacts/candidate_code_commit.txt
            artifacts/operations_state_commit.txt
          if-no-files-found: error
          retention-days: 90
