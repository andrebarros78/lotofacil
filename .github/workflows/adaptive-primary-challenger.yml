name: Adaptive Primary Challenger

on:
  workflow_run:
    workflows: ["Post Contest Learning Ledger"]
    types: [completed]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/sare_lotofacil/portfolios/coverage_guard.py"
      - "scripts/build_coverage_guard.py"
      - "tests/test_coverage_guard.py"
      - ".github/workflows/adaptive-primary-challenger.yml"

permissions: {}

concurrency:
  group: sare-derived-state-writer
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout engine
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: main
          path: app
      - name: Checkout committed operational state
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: operations/state
          path: state-store
      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"
      - name: Install engine and test adaptive plus coverage guard
        run: |
          python -m pip install './app[dev]'
          cd app
          python -m pytest tests/test_adaptive_primary.py tests/test_coverage_guard.py
      - name: Build adaptive challenger from canonical state
        run: |
          python app/scripts/build_adaptive_challenger.py \
            --state-dir state-store/operations \
            --out state-store/operations/adaptive_challenger.json \
            | tee adaptive-challenger-proof.json
          grep -q '"status": "ADAPTIVE_CHALLENGER_FROZEN"' adaptive-challenger-proof.json
      - name: Build exact two-card coverage guard
        run: |
          python app/scripts/build_coverage_guard.py \
            --state-dir state-store/operations \
            --out coverage-guard.json \
            | tee coverage-guard-proof.json
          grep -q '"status": "COVERAGE_GUARD_PROVEN"' coverage-guard-proof.json
          grep -q '"guaranteed_min_best_hits": 8' coverage-guard-proof.json
          grep -q '"purchase_executed": false' coverage-guard-proof.json
      - name: Attach coverage guard to derived challenger state
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          challenger_path = Path("state-store/operations/adaptive_challenger.json")
          guard_path = Path("coverage-guard.json")
          challenger = json.loads(challenger_path.read_text(encoding="utf-8"))
          guard = json.loads(guard_path.read_text(encoding="utf-8"))
          if int(challenger["target_contest"]) != int(guard["target_contest"]):
              raise SystemExit("COVERAGE_GUARD_TARGET_MISMATCH")
          challenger["coverage_guard"] = guard
          challenger_path.write_text(
              json.dumps(challenger, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Persist derived adaptive challenger state
        working-directory: state-store
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add operations/adaptive_challenger.json
          if git diff --cached --quiet; then
            echo "ADAPTIVE_CHALLENGER_UNCHANGED"
          else
            git commit -m "ops: persist adaptive challenger with coverage guard"
            git push origin HEAD:operations/state
          fi
      - name: Upload adaptive challenger and coverage proof
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: adaptive-primary-challenger
          path: |
            adaptive-challenger-proof.json
            coverage-guard-proof.json
            coverage-guard.json
            state-store/operations/adaptive_challenger.json
          if-no-files-found: error
