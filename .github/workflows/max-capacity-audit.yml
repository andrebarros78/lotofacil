name: Max Capacity Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/max-capacity-audit.yml"
      - "requirements.lock.txt"
      - "scripts/run_max_capacity_audit.py"
      - "scripts/verify_third_party_history.py"
      - "src/sare_lotofacil/analysis/**"
      - "src/sare_lotofacil/domain/**"
      - "src/sare_lotofacil/experiments/**"
      - "src/sare_lotofacil/simulation/**"
      - "src/sare_lotofacil/statistics/**"
      - "src/sare_lotofacil/portfolios/**"
      - "tests/test_capacity_audit.py"
      - "tests/test_calibration_rounds.py"
      - "tests/test_nested_walk_forward.py"
      - "tests/test_portfolio_audit.py"
      - "tests/test_special_rules.py"
      - "pyproject.toml"
  pull_request:
    paths:
      - ".github/workflows/max-capacity-audit.yml"
      - "requirements.lock.txt"
      - "scripts/run_max_capacity_audit.py"
      - "scripts/verify_third_party_history.py"
      - "src/sare_lotofacil/analysis/**"
      - "src/sare_lotofacil/domain/**"
      - "src/sare_lotofacil/experiments/**"
      - "src/sare_lotofacil/simulation/**"
      - "src/sare_lotofacil/statistics/**"
      - "src/sare_lotofacil/portfolios/**"
      - "tests/test_capacity_audit.py"
      - "tests/test_calibration_rounds.py"
      - "tests/test_nested_walk_forward.py"
      - "tests/test_portfolio_audit.py"
      - "tests/test_special_rules.py"
      - "pyproject.toml"

permissions:
  contents: read

jobs:
  max-capacity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"
      - name: Verify GitHub-only governance
        run: python scripts/verify_github_governance.py
      - name: Install locked SARE Core
        run: python -m pip install -c requirements.lock.txt -e .
      - name: Capture runtime dependencies
        run: |
          mkdir -p artifacts
          python -m pip freeze --all | sort | tee artifacts/dependencies-py313.txt
      - name: Reconcile real history
        run: python scripts/verify_third_party_history.py
      - name: Run maximum-capacity training and simulation audit
        run: python scripts/run_max_capacity_audit.py
      - name: Upload maximum-capacity evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: max-capacity-audit
          path: |
            artifacts/third_party_history_report.json
            artifacts/max_capacity_audit.json
            artifacts/real_history.db
            artifacts/dependencies-py313.txt
          if-no-files-found: warn
