name: Concurrency Fencing Proof

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/concurrency-fencing-proof.yml"
      - "scripts/prove_concurrency_fencing.py"
      - "src/sare_lotofacil/persistence/jobs.py"
      - "src/sare_lotofacil/persistence/operations.py"
      - "src/sare_lotofacil/persistence/db.py"
      - "src/sare_lotofacil/api/**"
      - "tests/test_concurrency_guards.py"
      - "tests/test_jobs.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/concurrency-fencing-proof.yml"
      - "scripts/prove_concurrency_fencing.py"
      - "src/sare_lotofacil/persistence/jobs.py"
      - "src/sare_lotofacil/persistence/operations.py"
      - "src/sare_lotofacil/persistence/db.py"
      - "src/sare_lotofacil/api/**"

permissions:
  contents: read

jobs:
  concurrency-fencing-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout candidate engine
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          path: app

      - name: Checkout canonical operational state
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: operations/state
          fetch-depth: 0
          path: state-store

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"

      - name: Install locked candidate test environment
        run: |
          cd app
          python -m pip install -c requirements.lock.txt -e '.[dev]'

      - name: Run focused concurrency tests
        run: |
          cd app
          python -m pytest -q tests/test_concurrency_guards.py tests/test_jobs.py

      - name: Run deterministic F4 concurrency proof
        run: |
          mkdir -p artifacts
          python app/scripts/prove_concurrency_fencing.py             --work-dir artifacts/runtime             --out artifacts/f4_concurrency_fencing.json
          grep -q '"status": "F4_CONCURRENCY_FENCING_PASS"' artifacts/f4_concurrency_fencing.json
          grep -q '"acquired": 1' artifacts/f4_concurrency_fencing.json
          grep -q '"stale_completion_blocked": true' artifacts/f4_concurrency_fencing.json

      - name: Verify canonical operational state unchanged
        run: |
          python app/scripts/verify_github_operational_state.py             --state-dir state-store/operations             --out artifacts/operational_state_integrity.json
          grep -q '"status": "GITHUB_OPERATIONAL_AUDIT_PASS"' artifacts/operational_state_integrity.json

      - name: Record provenance
        run: |
          git -C app rev-parse HEAD | tee artifacts/candidate_code_commit.txt
          git -C state-store rev-parse HEAD | tee artifacts/operations_state_commit.txt
          python - <<'PY'
          import json
          from pathlib import Path
          from sare_lotofacil.persistence.db import SCHEMA_VERSION

          proof = json.loads(Path("artifacts/f4_concurrency_fencing.json").read_text(encoding="utf-8"))
          payload = {
              "status": "F4_TERMINAL_PROOF_PASS",
              "schema_version": SCHEMA_VERSION,
              "concurrency": proof,
          }
          Path("artifacts/f4_terminal.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(payload, sort_keys=True))
          PY

      - name: Upload F4 evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: concurrency-fencing-proof
          path: |
            artifacts/f4_concurrency_fencing.json
            artifacts/f4_terminal.json
            artifacts/operational_state_integrity.json
            artifacts/candidate_code_commit.txt
            artifacts/operations_state_commit.txt
          if-no-files-found: error
          retention-days: 90

