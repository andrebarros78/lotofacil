name: F7 Crash Consistency Proof

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/f7-crash-consistency-proof.yml"
      - ".github/workflows/github-operations.yml"
      - ".github/workflows/operator-freeze-cards.yml"
      - "scripts/github_operational_cycle.py"
      - "scripts/github_operator_console.py"
      - "scripts/github_operator_freeze_cards.py"
      - "scripts/update_canonical_prizes.py"
      - "scripts/verify_canonical_prizes.py"
      - "scripts/verify_github_operational_state.py"
      - "scripts/prove_state_crash_consistency.py"
      - "src/sare_lotofacil/operational_state.py"
      - "tests/test_operational_state_transactions.py"
      - "tests/test_operational_state_contamination.py"
      - "tests/test_canonical_prizes_state.py"
      - "tests/test_operator_card_freeze.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/f7-crash-consistency-proof.yml"
      - ".github/workflows/github-operations.yml"
      - ".github/workflows/operator-freeze-cards.yml"
      - "scripts/github_operational_cycle.py"
      - "scripts/github_operator_console.py"
      - "scripts/github_operator_freeze_cards.py"
      - "scripts/update_canonical_prizes.py"
      - "scripts/verify_canonical_prizes.py"
      - "scripts/verify_github_operational_state.py"
      - "scripts/prove_state_crash_consistency.py"
      - "src/sare_lotofacil/operational_state.py"
      - "tests/test_operational_state_transactions.py"

permissions:
  contents: read

jobs:
  crash-consistency-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout candidate engine
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          path: app

      - name: Checkout canonical operational state
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: operations/state
          fetch-depth: 0
          path: state-store

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"

      - name: Install locked candidate environment
        run: |
          cd app
          python -m pip install -c requirements.lock.txt -e '.[dev]'

      - name: Focused F7 regression
        shell: bash
        run: |
          set -euo pipefail
          cd app
          python -m pytest -q             tests/test_operational_state_transactions.py             tests/test_operational_state_contamination.py             tests/test_canonical_prizes_state.py             tests/test_operator_card_freeze.py | tee ../artifacts-f7-tests.txt

      - name: Execute crash matrix and real-state seal
        run: |
          mkdir -p artifacts
          python app/scripts/prove_state_crash_consistency.py             --source-state state-store/operations             --work-dir artifacts/f7-runtime             --out artifacts/f7_crash_consistency.json
          grep -q '"status": "F7_CRASH_CONSISTENCY_PROOF_PASS"' artifacts/f7_crash_consistency.json
          grep -q '"mixed_generation_after_recovery": false' artifacts/f7_crash_consistency.json
          grep -q '"tamper_detection": true' artifacts/f7_crash_consistency.json
          grep -q '"database_integrity": "ok"' artifacts/f7_crash_consistency.json
          grep -q '"projection_matches_persisted_scientific_identity": true' artifacts/f7_crash_consistency.json
          grep -q '"restart_preserves_scientific_identity": true' artifacts/f7_crash_consistency.json
          grep -Eq '"runtime_db_sha256": "[0-9a-f]{64}"' artifacts/f7_crash_consistency.json

      - name: Verify sealed copy remains operationally valid
        run: |
          python app/scripts/verify_github_operational_state.py             --state-dir artifacts/f7-runtime/real-state             --out artifacts/f7_real_state_audit.json
          grep -q '"status": "GITHUB_OPERATIONAL_AUDIT_PASS"' artifacts/f7_real_state_audit.json
          grep -q '"status": "STATE_COMMIT_VERIFIED"' artifacts/f7_real_state_audit.json

      - name: Record provenance
        run: |
          git -C app rev-parse HEAD | tee artifacts/candidate_code_commit.txt
          git -C state-store rev-parse HEAD | tee artifacts/operations_state_commit.txt
          cp artifacts-f7-tests.txt artifacts/f7-focused-tests.txt

      - name: Upload F7 evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: f7-crash-consistency-proof
          path: |
            artifacts/f7_crash_consistency.json
            artifacts/f7_real_state_audit.json
            artifacts/f7-focused-tests.txt
            artifacts/candidate_code_commit.txt
            artifacts/operations_state_commit.txt
          if-no-files-found: error
          retention-days: 90
