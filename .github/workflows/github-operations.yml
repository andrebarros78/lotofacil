name: GitHub Operational Cycle

on:
  workflow_dispatch:
  schedule:
    - cron: "15 3 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/github-operations.yml"
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - "pyproject.toml"
      - "docs/GITHUB_OPERATIONS.md"

permissions:
  contents: write

concurrency:
  group: sare-github-operational-state
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout engine
        uses: actions/checkout@v4
        with:
          ref: main
          path: app
      - name: Checkout persistent state
        uses: actions/checkout@v4
        with:
          ref: operations/state
          path: state-store
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install and gate engine
        run: |
          python -m pip install -e './app[dev]'
          cd app
          python -m pytest
          python -m sare_lotofacil doctor
      - name: Run operational cycle
        run: |
          mkdir -p artifacts/github-runtime
          python app/scripts/github_operational_cycle.py \
            --state-dir state-store/operations \
            --runtime-dir artifacts/github-runtime | tee artifacts/github_operational_cycle.json
          grep -q '"status": "GITHUB_OPERATIONAL_CYCLE_PASS"' artifacts/github_operational_cycle.json
      - name: Verify state before commit
        run: |
          python app/scripts/verify_github_operational_state.py \
            --state-dir state-store/operations \
            --out artifacts/github_operational_audit_precommit.json
          grep -q '"status": "GITHUB_OPERATIONAL_AUDIT_PASS"' artifacts/github_operational_audit_precommit.json
      - name: Persist operational state in GitHub
        working-directory: state-store
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add operations/
          if git diff --cached --quiet; then
            echo "STATE_UNCHANGED"
          else
            git commit -m "ops: advance Lotofacil canonical and prospective state"
            git push origin HEAD:operations/state
          fi
      - name: Upload cycle evidence
        uses: actions/upload-artifact@v4
        with:
          name: github-operational-cycle
          path: |
            artifacts/github_operational_cycle.json
            artifacts/github_operational_audit_precommit.json
            artifacts/github-runtime/sare.db
            state-store/operations/*.json
          if-no-files-found: error

  committed-state-audit:
    needs: cycle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout engine
        uses: actions/checkout@v4
        with:
          ref: main
          path: app
      - name: Checkout committed state
        uses: actions/checkout@v4
        with:
          ref: operations/state
          fetch-depth: 0
          path: state-store
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install engine
        run: python -m pip install ./app
      - name: Independently recompute committed state
        run: |
          mkdir -p artifacts
          python app/scripts/verify_github_operational_state.py \
            --state-dir state-store/operations \
            --out artifacts/github_operational_audit_committed.json
          grep -q '"status": "GITHUB_OPERATIONAL_AUDIT_PASS"' artifacts/github_operational_audit_committed.json
          git -C state-store log --format='%H %cI %s' -- operations/ > artifacts/operational_git_history.txt
          test -s artifacts/operational_git_history.txt
      - name: Upload committed-state proof
        uses: actions/upload-artifact@v4
        with:
          name: github-committed-state-audit
          path: |
            artifacts/github_operational_audit_committed.json
            artifacts/operational_git_history.txt
          if-no-files-found: error
