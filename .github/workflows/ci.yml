name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install locked environment
        run: python -m pip install -c requirements.lock.txt -e '.[dev]'
      - name: Dependency snapshot
        run: python -m pip freeze --all | sort
      - name: Test
        run: python -m pytest
      - name: Doctor
        run: python -m sare_lotofacil doctor
      - name: GitHub-only governance gate
        run: python scripts/verify_github_governance.py
      - name: Agent ecosystem governance gate
        run: python scripts/validate_agent_ecosystem.py
      - name: Operator console smoke
        run: python scripts/github_operator_console.py --help >/dev/null
