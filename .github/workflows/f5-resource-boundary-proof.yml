name: F5 Resource Boundary Proof

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/f5-resource-boundary-proof.yml"
      - "scripts/prove_resource_boundaries.py"
      - "src/sare_lotofacil/resource_limits.py"
      - "src/sare_lotofacil/portfolios/**"
      - "src/sare_lotofacil/persistence/jobs.py"
      - "src/sare_lotofacil/api/**"
      - "tests/test_resource_boundaries.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/f5-resource-boundary-proof.yml"
      - "scripts/prove_resource_boundaries.py"
      - "src/sare_lotofacil/resource_limits.py"
      - "src/sare_lotofacil/portfolios/**"
      - "src/sare_lotofacil/persistence/jobs.py"
      - "src/sare_lotofacil/api/**"
      - "tests/test_resource_boundaries.py"

permissions:
  contents: read

jobs:
  resource-boundary-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout candidate engine
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          path: app

      - name: Checkout canonical operational state
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: operations/state
          fetch-depth: 0
          path: state-store

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"

      - name: Install locked candidate test environment
        run: |
          cd app
          python -m pip install -c requirements.lock.txt -e '.[dev]'

      - name: Focused resource boundary regression
        shell: bash
        run: |
          set -euo pipefail
          cd app
          python -m pytest -q             tests/test_resource_boundaries.py             tests/test_portfolios.py             tests/test_card_authority.py             tests/test_operator_card_freeze.py             tests/test_jobs.py             tests/test_api.py | tee ../artifacts-f5-tests.txt

      - name: Run deterministic F5 proof
        run: |
          mkdir -p artifacts
          python app/scripts/prove_resource_boundaries.py             --work-dir artifacts/runtime             --out artifacts/f5_resource_boundaries.json
          grep -q '"status": "RESOURCE_BOUNDARY_PROOF_PASS"' artifacts/f5_resource_boundaries.json
          grep -q '"pending_queue_saturation_blocked": true' artifacts/f5_resource_boundaries.json
          grep -q '"operator_attempt_exhaustion_blocked_without_ledger_mutation": true' artifacts/f5_resource_boundaries.json

      - name: Verify canonical operational state unchanged
        run: |
          python app/scripts/verify_github_operational_state.py             --state-dir state-store/operations             --out artifacts/operational_state_integrity.json
          grep -q '"status": "GITHUB_OPERATIONAL_AUDIT_PASS"' artifacts/operational_state_integrity.json

      - name: Record provenance
        run: |
          git -C app rev-parse HEAD | tee artifacts/candidate_code_commit.txt
          git -C state-store rev-parse HEAD | tee artifacts/operations_state_commit.txt
          cp artifacts-f5-tests.txt artifacts/f5-focused-tests.txt

      - name: Upload F5 evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: f5-resource-boundary-proof
          path: |
            artifacts/f5_resource_boundaries.json
            artifacts/operational_state_integrity.json
            artifacts/f5-focused-tests.txt
            artifacts/candidate_code_commit.txt
            artifacts/operations_state_commit.txt
          if-no-files-found: error
          retention-days: 90

