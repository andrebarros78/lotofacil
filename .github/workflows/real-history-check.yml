name: Real History Check

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/real-history-check.yml"
      - "scripts/verify_third_party_history.py"
      - "scripts/verify_github_governance.py"
      - "governance/**"
      - "src/sare_lotofacil/ingestion/**"
      - "src/sare_lotofacil/analysis/**"
      - "src/sare_lotofacil/statistics/**"
      - "src/sare_lotofacil/experiments/**"
      - "src/sare_lotofacil/domain/**"
      - "src/sare_lotofacil/persistence/**"
      - "pyproject.toml"

permissions:
  contents: read

jobs:
  verify-history:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Verify GitHub-only governance
        run: python scripts/verify_github_governance.py
      - name: Install SARE Core
        run: python -m pip install -e .
      - name: Verify third-party history against CAIXA checkpoints and analyze
        run: python scripts/verify_third_party_history.py
      - name: Upload verification artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: third-party-history-report
          path: |
            artifacts/third_party_history_report.json
            artifacts/real_history.db
          if-no-files-found: error
