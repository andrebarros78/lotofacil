name: Real History Check

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/real-history-check.yml"

permissions:
  contents: read

jobs:
  verify-history:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install SARE Core
        run: python -m pip install -e .
      - name: Verify third-party history against CAIXA checkpoints and analyze
        run: python scripts/verify_third_party_history.py
      - name: Upload verification artifact
        uses: actions/upload-artifact@v4
        with:
          name: third-party-history-report
          path: artifacts/third_party_history_report.json
          if-no-files-found: error
