name: SARE Operator Console

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Operação GitHub-only"
        required: true
        default: "status"
        type: choice
        options:
          - status
          - audit-state
          - analyze-state
          - ris-categorical
          - generate-portfolio
          - export-report
      card_count:
        description: "Quantidade de cartões para generate-portfolio (3-100)"
        required: false
        default: "10"
        type: string
      seed:
        description: "Seed; 0 usa o concurso-alvo"
        required: false
        default: "0"
        type: string

permissions:
  contents: read

jobs:
  operator:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout canonical engine
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: main
          path: app
      - name: Checkout canonical operational state
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: operations/state
          path: state-store
      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"
      - name: Install canonical engine
        run: python -m pip install ./app
      - name: Verify GitHub-only governance
        run: python app/scripts/verify_github_governance.py
      - name: Audit canonical state before operator action
        run: |
          mkdir -p artifacts/operator
          python app/scripts/verify_github_operational_state.py \
            --state-dir state-store/operations \
            --out artifacts/operator/state_audit.json
          grep -q '"status": "GITHUB_OPERATIONAL_AUDIT_PASS"' artifacts/operator/state_audit.json
      - name: Execute read-only operator action
        env:
          OPERATOR_ACTION: ${{ inputs.action }}
          CARD_COUNT: ${{ inputs.card_count }}
          SEED: ${{ inputs.seed }}
        run: |
          case "$OPERATOR_ACTION" in
            status) ACTION=status ;;
            audit-state) ACTION=audit ;;
            analyze-state) ACTION=analyze ;;
            ris-categorical) ACTION=ris ;;
            generate-portfolio) ACTION=portfolio ;;
            export-report) ACTION=export ;;
            *) echo "Unsupported action: $OPERATOR_ACTION" >&2; exit 2 ;;
          esac
          python app/scripts/github_operator_console.py \
            --action "$ACTION" \
            --state-dir state-store/operations \
            --out-dir artifacts/operator \
            --card-count "$CARD_COUNT" \
            --seed "$SEED"
      - name: Upload operator evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: sare-operator-${{ inputs.action }}-${{ github.run_id }}
          path: artifacts/operator/**
          if-no-files-found: error
