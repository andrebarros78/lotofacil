[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "sare-lotofacil"
version = "1.1.7"
description = "SARE Lotofácil Core 1.0 + Operational 1.1 — análise estatística auditável da Lotofácil"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Proprietary"}
authors = [{name = "Andre Barros"}]
keywords = ["lotofacil", "statistics", "audit"]
dependencies = ["fastapi>=0.115,<1.0", "uvicorn>=0.30,<1.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0,<10.0", "httpx>=0.27,<1.0"]

[project.scripts]
sare-lotofacil = "sare_lotofacil.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
