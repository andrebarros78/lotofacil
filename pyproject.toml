[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sare-lotofacil"
version = "1.1.9"
description = "SARE Lotofácil Core 1.0 + Operational 1.1 — análise estatística auditável da Lotofácil"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Proprietary"}
authors = [{name = "Andre Barros"}]
keywords = ["lotofacil", "statistics", "audit"]
dependencies = ["fastapi==0.141.1", "uvicorn==0.53.0"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "httpx==0.28.1"]

[project.scripts]
sare-lotofacil = "sare_lotofacil.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
