[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "sare-lotofacil"
version = "0.1.0"
description = "SARE Lotofácil Core — análise estatística auditável da Lotofácil"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Proprietary"}
authors = [{name = "Andre Barros"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0"]

[project.scripts]
sare-lotofacil = "sare_lotofacil.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
